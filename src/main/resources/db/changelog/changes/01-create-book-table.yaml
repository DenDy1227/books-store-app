databaseChangeLog:
  - changeSet:
      id: 01-create-books-table
      author: denDy
      changes:
        - createTable:
            tableName: books
            tableOptions: "ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci"
            columns:
              - column:
                  name: is_deleted
                  type: BIT(1)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(38,2)
                  constraints:
                    nullable: false
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: author
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: cover_image
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: isbn
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: books
            columnNames: isbn
            constraintName: UKkibbepcitr0a3cpk3rfr7nihn