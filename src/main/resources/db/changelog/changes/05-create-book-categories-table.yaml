databaseChangeLog:
  - changeSet:
      id: 05-create-books-categories-table
      author: denDy
      changes:
        - createTable:
            tableName: books_categories
            tableOptions: "ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci"
            columns:
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: books_categories
            columnNames: book_id,category_id
            constraintName: pk_books_categories

        - createIndex:
            tableName: books_categories
            indexName: idx_books_categories_category_id
            columns:
              - column:
                  name: category_id

        - addForeignKeyConstraint:
            baseTableName: books_categories
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: FK4klp9o273ej1ywgmie14rvdx3

        - addForeignKeyConstraint:
            baseTableName: books_categories
            baseColumnNames: book_id
            referencedTableName: books
            referencedColumnNames: id
            constraintName: FKmsuoucvyyccli3f6u59co41cq