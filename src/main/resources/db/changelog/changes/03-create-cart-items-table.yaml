databaseChangeLog:
  - changeSet:
      id: 03-create-cart-items-table
      author: denDy
      changes:
        - createTable:
            tableName: cart_items
            tableOptions: "ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci"
            columns:
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: cart_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

        - createIndex:
            tableName: cart_items
            indexName: idx_cart_items_book_id
            columns:
              - column:
                  name: book_id

        - createIndex:
            tableName: cart_items
            indexName: idx_cart_items_cart_id
            columns:
              - column:
                  name: cart_id

        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: book_id
            referencedTableName: books
            referencedColumnNames: id
            constraintName: fk_cart_items_book_id

        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: cart_id
            referencedTableName: shopping_carts
            referencedColumnNames: id
            constraintName: fk_cart_items_cart_id