databaseChangeLog:
  - changeSet:
      id: 06-create-roles-table
      author: denDy
      changes:
        - createTable:
            tableName: roles
            tableOptions: "ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: ENUM('ADMIN','USER')
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: roles
            columnNames: name
            constraintName: UKofx66keruapi6vyqpv6f2or37